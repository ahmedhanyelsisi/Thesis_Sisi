<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFE Rectifier Dashboard - Executive View</title>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Inter for readability, Outfit for premium headings -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Premium IEEE Executive Theme */
        :root {
            --ieee-blue: #00629B;
            --ieee-dark: #002855;
            --ieee-light: #00A3E0;
            --gold: #FFB81C;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--ieee-dark);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(0, 163, 224, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(0, 98, 155, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 40, 85, 0.8) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 2.5rem;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, th { font-family: 'Outfit', sans-serif; }

        .container {
            max-width: 1500px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: slideDown 0.5s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .title h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: -0.02em;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        .title p { 
            color: rgba(255,255,255,0.85); 
            font-size: 1.15rem; 
            font-weight: 500;
        }

        /* BUTTONS */
        button {
            background: linear-gradient(135deg, var(--ieee-blue), #004A75);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 98, 155, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 16px rgba(0, 98, 155, 0.4); 
            background: linear-gradient(135deg, #0070b1, #005688);
        }
        button:active { transform: translateY(0); }

        button.secondary { background: white; color: var(--ieee-blue); box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        button.secondary:hover { background: #f0f7ff; box-shadow: 0 4px 10px rgba(0, 98, 155, 0.1); }

        /* HEADER ACTIONS SPECIFIC STYLES */
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .header-actions button { backdrop-filter: blur(5px); }
        .header-actions button.secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); box-shadow: none; }
        .header-actions button.secondary:hover { background: rgba(255,255,255,0.25); border-color: white; }
        .header-actions button.primary { background: var(--gold); color: var(--ieee-dark); box-shadow: 0 4px 15px rgba(255, 184, 28, 0.4); }
        .header-actions button.primary:hover { background: #ffcc4d; box-shadow: 0 6px 20px rgba(255, 184, 28, 0.6); }
        .header-actions button.danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); box-shadow: none; }
        .header-actions button.danger:hover { background: rgba(239, 68, 68, 0.4); color: white; border-color: #fca5a5;}

        /* TABS */
        .tabs { 
            display: flex; 
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem; 
            margin-bottom: 2.5rem; 
            animation: fadeIn 0.6s ease-out;
        }
        .tab { 
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 0.8rem 2.5rem;
            color: white;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .tab.active { background: #ffffff; color: var(--ieee-blue); box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-color: #ffffff; }

        /* VIEW PANEL */
        .view-panel {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.5);
            min-height: 600px;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* SUMMARY METRICS */
        .summary-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .metric-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s;
            border: 1px solid #f1f5f9;
        }
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--ieee-light), var(--ieee-blue));
        }
        .metric-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .metric-card h4 { color: var(--text-muted); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif; }
        .metric-card .value { font-size: 3.5rem; font-weight: 800; font-family: 'Outfit', sans-serif; color: var(--ieee-dark); line-height: 1; }
        
        .metric-card.mc-success::before { background: var(--success); }
        .metric-card.mc-success .value { color: var(--success); }
        .metric-card.mc-warning::before { background: var(--warning); }
        .metric-card.mc-warning .value { color: var(--warning); }
        .metric-card.mc-danger::before { background: var(--danger); }
        .metric-card.mc-danger .value { color: var(--danger); }

        /* CHARTS & LISTS */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .chart-box, .list-box {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }
        
        .lists-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .list-box h3 { 
            margin-bottom: 1.5rem; 
            color: var(--ieee-dark); 
            font-size: 1.5rem; 
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .list-box ul { list-style: none; }
        .list-box li { 
            padding: 1rem 1.25rem; 
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            font-size: 1rem; 
            font-weight: 500;
            border-left: 4px solid transparent;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .list-box li:hover { transform: translateX(5px); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .list-box.pending-list h3::before { content: '⏳'; }
        .list-box.failed-list h3::before { content: '🚨'; }
        .list-box.pending-list li { border-left-color: var(--warning); }
        .list-box.failed-list li { border-left-color: var(--danger); }

        /* TABLE VIEW CONTROLS */
        .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }

        /* TABLE STYLES */
        .table-container {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { 
            background: var(--ieee-blue); 
            color: white; 
            padding: 1.25rem 1rem; 
            font-size: 0.9rem; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }
        th input {
            background: transparent;
            border: 1px solid transparent;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            outline: none;
            width: 100%;
            padding: 0.4rem;
            border-radius: 6px;
            transition: all 0.2s;
        }
        th input:hover, th input:focus { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
        
        .th-content { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .th-delete-btn { 
            color: rgba(255,255,255,0.6); 
            background: transparent; 
            border: none; 
            padding: 0.2rem; 
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .th-delete-btn:hover { color: white; transform: scale(1.1); }

        .main-row td { 
            padding: 1rem; 
            border-bottom: 1px solid #f1f5f9; 
            background: white; 
            vertical-align: middle;
        }
        .main-row:hover td { background-color: #f8fafc; }
        
        .plot-row td {
            padding: 0;
            border-bottom: 4px solid #cbd5e1;
            background-color: #f8fafc;
        }
        
        .plot-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.25rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin: 0.5rem 1rem 1.5rem 1rem;
        }

        .plot-thumb-wrap {
            position: relative;
            width: 220px;
            height: 160px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .plot-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .plot-thumb-wrap:hover img { transform: scale(1.08); }
        .thumb-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.4rem;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .plot-thumb-wrap:hover .thumb-actions { opacity: 1; }
        .thumb-actions button {
            background: rgba(255,255,255,0.95);
            border: 1px solid #cbd5e1;
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .thumb-actions button.danger { color: var(--danger); }
        .thumb-actions button:hover { background: white; border-color: var(--text-muted); transform: translateY(-1px); }

        .plot-upload-multiple {
            width: 220px;
            height: 160px;
            border: 2px dashed var(--ieee-blue);
            border-radius: 10px;
            background: rgba(0, 98, 155, 0.03);
            cursor: pointer;
            color: var(--ieee-blue);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .plot-upload-multiple:hover {
            background: rgba(0, 98, 155, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 98, 155, 0.15);
        }
        .plot-upload-label {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* INPUTS & SELECTS */
        .editable {
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.6rem 0.75rem;
            border: 1px solid transparent;
            border-radius: 6px;
            width: 100%;
            transition: all 0.2s;
            color: var(--text-main);
            background: transparent;
            outline: none;
        }
        .editable:hover { border-color: #e2e8f0; background: #f8fafc; }
        .editable:focus { border-color: var(--ieee-light); background: white; box-shadow: 0 0 0 3px rgba(0, 163, 224, 0.15); }
        
        select.status {
            appearance: none;
            background-color: white;
            border: 2px solid;
            padding: 0.5rem 2.2rem 0.5rem 1rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23333" viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            outline: none;
        }
        select.status:focus { box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        .status-done { color: #059669; border-color: #34d399 !important; background-color: #ecfdf5 !important; }
        .status-pending { color: #d97706; border-color: #fbbf24 !important; background-color: #fffbeb !important; }
        .status-failed { color: #dc2626; border-color: #f87171 !important; background-color: #fef2f2 !important; }
        
        .row-delete-btn { 
            color: #94a3b8; 
            background: transparent; 
            border: none; 
            padding: 0.5rem; 
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
        }
        .row-delete-btn:hover { color: var(--danger); background: #fee2e2; transform: scale(1.1); }

        /* LIGHTBOX GALLERY STYLES */
        #lightboxOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 40, 85, 0.95);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        #lightboxImageContainer {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #lightboxImage {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            cursor: grab;
            transition: transform 0.2s ease-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 8px;
        }
        #lightboxImage:active { cursor: grabbing; }
        .lightbox-controls {
            position: absolute;
            bottom: 2.5rem;
            display: flex;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            z-index: 10000;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .lightbox-controls button {
            background: white;
            color: var(--ieee-dark);
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: none;
        }
        .lightbox-controls button:hover { background: #e2e8f0; transform: translateY(-2px); }
        
        .lightbox-close {
            position: absolute;
            top: 2rem; right: 2.5rem;
            background: rgba(0,0,0,0.4);
            color: white;
            border: 2px solid rgba(255,255,255,0.6);
            font-size: 1.2rem;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s;
        }
        .lightbox-close:hover { background: var(--danger); border-color: var(--danger); transform: scale(1.1); }
        
        .lightbox-nav {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.4);
            color: white;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            width: 56px; height: 56px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); border-color: white; transform: translateY(-50%) scale(1.1); }
        .lightbox-prev { left: 2.5rem; }
        .lightbox-next { right: 2.5rem; }
        
        #lightboxCounter {
            position: absolute;
            top: 2.5rem; left: 2.5rem;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            z-index: 10000;
            background: rgba(0,0,0,0.4);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }

        /* PRINT STYLES */
        @media print {
            .header-actions, .controls, .tabs, .plot-upload-multiple, .thumb-actions, .th-delete-btn, .row-delete-btn, #lightboxOverlay { display: none !important; }
            body { background: white; padding: 0; }
            .container { max-width: 100%; }
            .view-panel { box-shadow: none; border: none; padding: 0; }
            .header .title h1 { color: black; text-shadow: none; }
            .header .title p { color: #333; }
            .chart-box, .list-box, .metric-card, .table-container, .plot-thumb-wrap { 
                box-shadow: none !important; 
                border: 1px solid #cbd5e1 !important; 
                break-inside: avoid;
            }
            .plot-row, .main-row { break-inside: avoid; }
            th { background-color: #f1f5f9 !important; color: black; -webkit-print-color-adjust: exact; }
            th input { color: black; }
            .status-done { background-color: #dcfce7 !important; -webkit-print-color-adjust: exact; }
            .status-pending { background-color: #fef3c7 !important; -webkit-print-color-adjust: exact; }
            .status-failed { background-color: #fee2e2 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="title">
                <h1>AFE Rectifier Dashboard</h1>
                <p>System Test Tracking & MATLAB Plot Repository</p>
            </div>
            <div class="header-actions">
                <button onclick="resetData()" class="danger" title="Clear all data">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Reset Data
                </button>
                <button onclick="window.print()" class="secondary" title="Print to PDF">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print / PDF
                </button>
                <button onclick="exportCSV()" class="primary" title="Export data to Excel/CSV">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export CSV
                </button>
            </div>
        </div>

        <!-- TABS NAVIGATION -->
        <div class="tabs" id="tabs">
            <!-- Rendered via JS -->
        </div>

        <!-- EXECUTIVE VIEW PANEL -->
        <div class="view-panel">
            
            <!-- OVERALL SUMMARY VIEW -->
            <div id="summaryView" class="view">
                <div class="summary-metrics" id="summaryMetrics"></div>
                
                <div class="charts-container">
                    <div class="chart-box">
                        <canvas id="chartAll"></canvas>
                    </div>
                    <div class="chart-box">
                        <canvas id="chartBreakdown"></canvas>
                    </div>
                </div>

                <div class="lists-container">
                    <div class="list-box pending-list">
                        <h3>Pending / Missing Tests</h3>
                        <ul id="pendingList"></ul>
                    </div>
                    <div class="list-box failed-list">
                        <h3>Failed Tests (Action Required)</h3>
                        <ul id="failedList"></ul>
                    </div>
                </div>
            </div>

            <!-- TABLE VIEW -->
            <div id="tableView" class="view">
                <div class="controls">
                    <button onclick="addRow()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Test Case
                    </button>
                    <button onclick="addColumn()" class="secondary">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Add Custom Column
                    </button>
                </div>

                <div class="table-container">
                    <table id="dataTable">
                        <!-- Rendered via JS -->
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- LIGHTBOX / FULLSCREEN OVERLAY -->
    <div id="lightboxOverlay">
        <button class="lightbox-close" onclick="closeLightbox()" title="Close (Esc)">✖</button>
        <div id="lightboxCounter">1 / 1</div>
        
        <button class="lightbox-nav lightbox-prev" onclick="prevLightboxImage()" title="Previous">&#10094;</button>
        <button class="lightbox-nav lightbox-next" onclick="nextLightboxImage()" title="Next">&#10095;</button>

        <div id="lightboxImageContainer">
            <img id="lightboxImage" src="" alt="Fullscreen Plot">
        </div>

        <div class="lightbox-controls">
            <button onclick="changeZoom(-0.25)" title="Zoom Out (Scroll Down)">➖ Zoom Out</button>
            <button onclick="resetZoom()" title="Reset Zoom">Reset</button>
            <button onclick="changeZoom(0.25)" title="Zoom In (Scroll Up)">➕ Zoom In</button>
        </div>
    </div>

    <script>
        // Set Chart.js Defaults for the new theme
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#475569';
        Chart.defaults.font.size = 13;

        // --- DATABASE & STORAGE (BACKEND API) ---
        async function saveDataToDB(dbData) {
            try {
                const response = await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dbData)
                });
                if (!response.ok) throw new Error("Failed to save data");
            } catch(e) {
                console.error("Backend error, falling back to localStorage", e);
                localStorage.setItem('afe_backup', JSON.stringify(dbData));
            }
        }

        async function loadDataFromDB() {
            try {
                const response = await fetch('/api/data');
                const result = await response.json();
                if (result.status === "success" && result.data) return result.data;
            } catch(e) {
                console.error("Backend fetch error, falling back to localStorage", e);
                const backup = localStorage.getItem('afe_backup');
                return backup ? JSON.parse(backup) : null;
            }
            return null;
        }

        // --- INITIAL DATA STRUCTURE ---
        const initialData = {
            activeTab: 0,
            tabs: [
                {
                    name: 'PI VOC Controller',
                    columns: ['Test Case', 'Description', 'Expected Result', 'Status', 'Notes'],
                    rows: [
                        { id: 1, 'Test Case': 'Steady State Vdc', 'Description': 'Vdc regulation under nominal load', 'Expected Result': 'Vdc = 700V +/- 1%', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 2, 'Test Case': 'Unity Power Factor', 'Description': 'PF at full load', 'Expected Result': 'PF > 0.99', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 3, 'Test Case': 'Load Step 50% to 100%', 'Description': 'Transient response on resistive load', 'Expected Result': 'Settling time < 50ms', 'Status': 'Pending', 'Notes': '', plotImages: [] }
                    ]
                },
                {
                    name: 'M2PC Controller',
                    columns: ['Test Case', 'Description', 'Expected Result', 'Status', 'Notes'],
                    rows: [
                        { id: 1, 'Test Case': 'Steady State Vdc', 'Description': 'Vdc regulation under nominal load', 'Expected Result': 'Vdc = 700V +/- 1%', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 2, 'Test Case': 'Current THD', 'Description': 'THD at nominal load', 'Expected Result': 'THD < 5%', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 3, 'Test Case': 'Computational Delay', 'Description': 'Test delay handling', 'Expected Result': 'Stable operation', 'Status': 'Pending', 'Notes': '', plotImages: [] }
                    ]
                },
                {
                    name: 'Modified M2PC Controller',
                    columns: ['Test Case', 'Description', 'Expected Result', 'Status', 'Notes'],
                    rows: [
                        { id: 1, 'Test Case': 'Switching Frequency', 'Description': 'Average switching frequency', 'Expected Result': 'Reduced vs standard M2PC', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 2, 'Test Case': 'Current THD', 'Description': 'THD at nominal load', 'Expected Result': 'Comparable to M2PC', 'Status': 'Pending', 'Notes': '', plotImages: [] },
                        { id: 3, 'Test Case': 'Steady State Ripple', 'Description': 'DC link voltage ripple', 'Expected Result': 'Reduced ripple', 'Status': 'Pending', 'Notes': '', plotImages: [] }
                    ]
                }
            ]
        };

        let data = null;
        let chartAllInstance = null;
        let chartBreakdownInstance = null;

        // --- CORE LOGIC ---
        async function init() {
            const stored = await loadDataFromDB();
            if (stored) {
                data = stored;
                let needsSave = false;
                data.tabs.forEach(tab => {
                    tab.rows.forEach(row => {
                        if (!row.plotImages) { row.plotImages = []; needsSave = true; }
                        if (row.plotImage) {
                            if (typeof row.plotImage === 'string') { row.plotImages.push(row.plotImage); }
                            row.plotImage = null; needsSave = true;
                        }
                    });
                });
                if (needsSave) await saveDataToDB(data);
            } else {
                data = JSON.parse(JSON.stringify(initialData));
                await saveDataToDB(data);
            }
            
            setupLightboxEvents();
            render();
        }

        async function saveData() {
            await saveDataToDB(data);
            render();
        }

        async function resetData() {
            if(confirm("Are you sure you want to reset all data to default templates? All your progress and uploaded plots will be permanently lost.")) {
                data = JSON.parse(JSON.stringify(initialData));
                await saveData();
            }
        }

        function escapeHTML(str) {
            if(!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // --- RENDER FUNCTIONS ---
        function render() {
            const summaryView = document.getElementById('summaryView');
            const tableView = document.getElementById('tableView');

            renderTabs();

            if (data.activeTab === 0) {
                summaryView.classList.add('active');
                tableView.classList.remove('active');
                renderSummaryMetrics();
                renderSummaryLists();
                renderCharts();
            } else {
                summaryView.classList.remove('active');
                tableView.classList.add('active');
                renderTable();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs');
            let html = `
                <div class="tab ${data.activeTab === 0 ? 'active' : ''}" onclick="switchTab(0)">
                    📊 Overall Summary
                </div>
            `;
            data.tabs.forEach((tab, idx) => {
                html += `
                    <div class="tab ${data.activeTab === (idx + 1) ? 'active' : ''}" onclick="switchTab(${idx + 1})">
                        ${tab.name}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function switchTab(idx) {
            data.activeTab = idx;
            await saveData(); 
        }

        // --- SUMMARY TAB LOGIC ---
        function renderSummaryMetrics() {
            let total = 0, done = 0, failed = 0;
            data.tabs.forEach(tab => {
                tab.rows.forEach(row => {
                    total++;
                    if(row['Status'] === 'Done') done++;
                    if(row['Status'] === 'Failed') failed++;
                });
            });
            const pending = total - done - failed;
            
            document.getElementById('summaryMetrics').innerHTML = `
                <div class="metric-card">
                    <h4>Total Test Cases</h4>
                    <div class="value">${total}</div>
                </div>
                <div class="metric-card mc-success">
                    <h4>Successfully Done</h4>
                    <div class="value">${done}</div>
                </div>
                <div class="metric-card mc-warning">
                    <h4>Pending Tests</h4>
                    <div class="value">${pending}</div>
                </div>
                <div class="metric-card mc-danger">
                    <h4>Failed Tests</h4>
                    <div class="value">${failed}</div>
                </div>
            `;
        }

        function renderSummaryLists() {
            const pendingList = document.getElementById('pendingList');
            const failedList = document.getElementById('failedList');
            
            let pendingHTML = '';
            let failedHTML = '';

            data.tabs.forEach(tab => {
                tab.rows.forEach(r => {
                    const st = r['Status'] || 'Pending';
                    const name = r['Test Case'] || 'Unnamed Test Case';
                    const item = `<li><strong>${tab.name}</strong> &mdash; ${escapeHTML(name)}</li>`;
                    if(st === 'Failed') failedHTML += item;
                    else if(st !== 'Done') pendingHTML += item;
                });
            });

            pendingList.innerHTML = pendingHTML || '<li><span style="color:var(--success)">No pending tests. All done!</span></li>';
            failedList.innerHTML = failedHTML || '<li><span style="color:var(--success)">No failed tests.</span></li>';
        }

        function renderCharts() {
            const ctxAll = document.getElementById('chartAll');
            const ctxBreakdown = document.getElementById('chartBreakdown');

            if(!ctxAll || !ctxBreakdown) return;

            if(chartAllInstance) chartAllInstance.destroy();
            if(chartBreakdownInstance) chartBreakdownInstance.destroy();

            let allDone = 0, allPending = 0, allFailed = 0;
            const controllers = [];
            const ctrlDone = [], ctrlPending = [], ctrlFailed = [];

            data.tabs.forEach(tab => {
                controllers.push(tab.name.replace(' Controller', ''));
                let d = 0, p = 0, f = 0;
                tab.rows.forEach(r => {
                    const st = r['Status'] || 'Pending';
                    if(st === 'Done') { d++; allDone++; }
                    else if(st === 'Failed') { f++; allFailed++; }
                    else { p++; allPending++; }
                });
                ctrlDone.push(d);
                ctrlPending.push(p);
                ctrlFailed.push(f);
            });

            const total = allDone + allPending + allFailed;
            const dp = total ? ((allDone/total)*100).toFixed(1) : 0;
            const pp = total ? ((allPending/total)*100).toFixed(1) : 0;
            const fp = total ? ((allFailed/total)*100).toFixed(1) : 0;

            const chartFont = { family: "'Outfit', sans-serif", size: 16, weight: '600', color: '#1e293b' };

            // Chart 1: All Controllers Percentage
            chartAllInstance = new Chart(ctxAll, {
                type: 'doughnut',
                data: {
                    labels: ['Done', 'Pending', 'Failed'],
                    datasets: [{
                        data: [dp, pp, fp],
                        backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    cutout: '65%',
                    plugins: {
                        title: { display: true, text: 'Overall System Status (%)', font: chartFont, padding: {bottom: 20} },
                        legend: { position: 'bottom', labels: { font: { family: "'Inter', sans-serif", size: 13 } } }
                    }
                }
            });

            // Chart 2: Controller Breakdown
            chartBreakdownInstance = new Chart(ctxBreakdown, {
                type: 'bar',
                data: {
                    labels: controllers,
                    datasets: [
                        { label: 'Done', data: ctrlDone, backgroundColor: '#10b981', borderRadius: 4 },
                        { label: 'Pending', data: ctrlPending, backgroundColor: '#f59e0b', borderRadius: 4 },
                        { label: 'Failed', data: ctrlFailed, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: 'Test Status by Controller', font: chartFont, padding: {bottom: 20} }
                    },
                    scales: { 
                        x: { stacked: true, grid: { display: false } },
                        y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 }, border: {display: false} }
                    }
                }
            });
        }

        // --- TABLE VIEW LOGIC ---
        function renderTable() {
            const tab = data.tabs[data.activeTab - 1];
            const container = document.getElementById('dataTable');
            
            let thead = '<thead><tr>';
            tab.columns.forEach((col, cIdx) => {
                if(col === 'Status') {
                    thead += `<th style="width: 160px; text-align: center;">${col}</th>`;
                } else {
                    thead += `
                        <th>
                            <div class="th-content">
                                <input type="text" value="${escapeHTML(col)}" onchange="updateColumnName(${cIdx}, this.value)" title="Rename column">
                                <button class="th-delete-btn" onclick="deleteColumn(${cIdx})" title="Delete Column">✖</button>
                            </div>
                        </th>
                    `;
                }
            });
            thead += '<th style="width: 60px; text-align: center;"></th></tr></thead>';

            let tbody = '<tbody>';
            tab.rows.forEach((row, rIdx) => {
                // 1. The Main Text Row
                tbody += '<tr class="main-row">';
                tab.columns.forEach(col => {
                    if (col === 'Status') {
                        const val = row[col] || 'Pending';
                        let statusClass = val === 'Done' ? 'status-done' : (val === 'Failed' ? 'status-failed' : 'status-pending');
                        tbody += `
                            <td style="text-align: center;">
                                <select class="status ${statusClass}" onchange="updateCell(${rIdx}, '${escapeHTML(col)}', this.value)">
                                    <option value="Pending" ${val === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Done" ${val === 'Done' ? 'selected' : ''}>Done</option>
                                    <option value="Failed" ${val === 'Failed' ? 'selected' : ''}>Failed</option>
                                </select>
                            </td>
                        `;
                    } else {
                        const val = escapeHTML(row[col]);
                        tbody += `
                            <td>
                                <input class="editable" type="text" value="${val}" onchange="updateCell(${rIdx}, '${escapeHTML(col)}', this.value)" placeholder="...">
                            </td>
                        `;
                    }
                });
                tbody += `
                    <td style="text-align: center;">
                        <button class="row-delete-btn" onclick="deleteRow(${rIdx})" title="Delete Test Case">
                            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                </tr>`;

                // 2. The Multiple Plots Row
                const plotImagesHTML = row.plotImages.map((imgSrc, imgIdx) => `
                    <div class="plot-thumb-wrap">
                        <img src="${imgSrc}" onclick="openLightbox(${data.activeTab - 1}, ${rIdx}, ${imgIdx})" title="Click to view fullscreen">
                        <div class="thumb-actions">
                            <button onclick="openLightbox(${data.activeTab - 1}, ${rIdx}, ${imgIdx})" title="Fullscreen / Zoom">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                            </button>
                            <button class="danger" onclick="removeImage(${rIdx}, ${imgIdx})" title="Remove Plot">✖</button>
                        </div>
                    </div>
                `).join('');

                const uploadBtnHTML = `
                    <div class="plot-upload-multiple">
                        <label class="plot-upload-label">
                            <svg style="width:36px;height:36px;margin-bottom:12px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span style="font-weight: 600; font-family:'Outfit', sans-serif;">Attach Plot</span>
                            <input type="file" accept="image/*" multiple onchange="handleMultipleImageUpload(${rIdx}, this.files)" style="display:none">
                        </label>
                    </div>
                `;

                tbody += `<tr class="plot-row">
                    <td colspan="${tab.columns.length + 1}">
                        <div class="plot-grid">
                            ${plotImagesHTML}
                            ${uploadBtnHTML}
                        </div>
                    </td>
                </tr>`;
            });
            tbody += '</tbody>';

            container.innerHTML = thead + tbody;
        }

        async function addRow() {
            const tab = data.tabs[data.activeTab - 1];
            const newRow = { id: Date.now(), plotImages: [] };
            tab.columns.forEach(col => { newRow[col] = col === 'Status' ? 'Pending' : ''; });
            tab.rows.push(newRow);
            await saveData();
        }

        async function deleteRow(rIdx) {
            if(confirm("Are you sure you want to delete this test case entirely?")) {
                data.tabs[data.activeTab - 1].rows.splice(rIdx, 1);
                await saveData();
            }
        }

        async function addColumn() {
            const colName = prompt("Enter new column name:");
            if(colName && colName.trim() !== '') {
                const tab = data.tabs[data.activeTab - 1];
                if(tab.columns.includes(colName)) {
                    alert("A column with this name already exists!");
                    return;
                }
                tab.columns.push(colName);
                tab.rows.forEach(row => { row[colName] = ''; });
                await saveData();
            }
        }

        async function deleteColumn(cIdx) {
            const tab = data.tabs[data.activeTab - 1];
            const colName = tab.columns[cIdx];
            if(colName === 'Status') {
                alert("The Status column cannot be deleted because it is required for dashboard calculations.");
                return;
            }
            if(confirm(`Delete column '${colName}' and all its text data?`)) {
                tab.columns.splice(cIdx, 1);
                tab.rows.forEach(row => { delete row[colName]; });
                await saveData();
            }
        }

        async function updateColumnName(cIdx, newName) {
            const tab = data.tabs[data.activeTab - 1];
            const oldName = tab.columns[cIdx];
            
            if(oldName === 'Status') {
                alert("The Status column cannot be renamed.");
                render();
                return;
            }
            
            if(newName && newName.trim() !== '' && newName !== oldName) {
                if(tab.columns.includes(newName)) {
                    alert("A column with this name already exists!");
                    render();
                    return;
                }
                tab.columns[cIdx] = newName;
                tab.rows.forEach(row => {
                    row[newName] = row[oldName];
                    delete row[oldName];
                });
                await saveData();
            } else {
                render();
            }
        }

        async function updateCell(rIdx, colName, value) {
            data.tabs[data.activeTab - 1].rows[rIdx][colName] = value;
            await saveData();
        }

        // --- MATLAB MULTIPLE PLOTS HANDLERS ---
        async function handleMultipleImageUpload(rIdx, files) {
            if(!files || files.length === 0) return;
            const tabIdx = data.activeTab - 1;
            
            let largeFile = false;
            for(let f of files) { if(f.size > 2 * 1024 * 1024) largeFile = true; }
            if (largeFile) {
                alert("Note: Uploading very large images might slow down the dashboard. Keep screenshots reasonably sized for best performance.");
            }

            const readPromises = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            });

            const results = await Promise.all(readPromises);
            data.tabs[tabIdx].rows[rIdx].plotImages.push(...results);
            await saveData();
        }

        async function removeImage(rIdx, imgIdx) {
            if(confirm("Remove this plot?")) {
                data.tabs[data.activeTab - 1].rows[rIdx].plotImages.splice(imgIdx, 1);
                await saveData();
            }
        }

        // --- FULLSCREEN LIGHTBOX & PAN/ZOOM LOGIC ---
        let currentLightboxImages = [];
        let currentLightboxIndex = 0;
        let zoomLevel = 1;
        let isDragging = false;
        let startX = 0, startY = 0;
        let transX = 0, transY = 0;

        function openLightbox(tabIdx, rIdx, imgIndex) {
            currentLightboxImages = data.tabs[tabIdx].rows[rIdx].plotImages || [];
            currentLightboxIndex = imgIndex;
            showLightboxImage();
            document.getElementById('lightboxOverlay').style.display = 'flex';
        }

        function showLightboxImage() {
            zoomLevel = 1; transX = 0; transY = 0;
            const img = document.getElementById('lightboxImage');
            
            img.style.transition = 'transform 0.2s ease-out';
            updateLightboxTransform();
            setTimeout(() => { img.style.transition = 'none'; }, 200);
            
            img.src = currentLightboxImages[currentLightboxIndex];
            document.getElementById('lightboxCounter').innerText = `${currentLightboxIndex + 1} / ${currentLightboxImages.length}`;

            document.querySelector('.lightbox-prev').style.display = currentLightboxIndex > 0 ? 'flex' : 'none';
            document.querySelector('.lightbox-next').style.display = currentLightboxIndex < currentLightboxImages.length - 1 ? 'flex' : 'none';
        }

        function closeLightbox() {
            document.getElementById('lightboxOverlay').style.display = 'none';
        }

        function nextLightboxImage() {
            if(currentLightboxIndex < currentLightboxImages.length - 1) {
                currentLightboxIndex++; showLightboxImage();
            }
        }

        function prevLightboxImage() {
            if(currentLightboxIndex > 0) {
                currentLightboxIndex--; showLightboxImage();
            }
        }

        function changeZoom(amount) {
            zoomLevel += amount;
            if(zoomLevel < 0.2) zoomLevel = 0.2;
            if(zoomLevel > 15) zoomLevel = 15;
            
            const img = document.getElementById('lightboxImage');
            img.style.transition = 'transform 0.15s ease-out';
            updateLightboxTransform();
            setTimeout(() => { img.style.transition = 'none'; }, 150);
        }

        function resetZoom() {
            zoomLevel = 1; transX = 0; transY = 0;
            const img = document.getElementById('lightboxImage');
            img.style.transition = 'transform 0.2s ease-out';
            updateLightboxTransform();
            setTimeout(() => { img.style.transition = 'none'; }, 200);
        }

        function updateLightboxTransform() {
            const img = document.getElementById('lightboxImage');
            img.style.transform = `translate(${transX}px, ${transY}px) scale(${zoomLevel})`;
        }

        function setupLightboxEvents() {
            const img = document.getElementById('lightboxImage');
            const container = document.getElementById('lightboxImageContainer');

            img.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - transX; startY = e.clientY - transY;
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if(isDragging) {
                    transX = e.clientX - startX; transY = e.clientY - startY;
                    updateLightboxTransform();
                }
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                changeZoom(e.deltaY > 0 ? -0.2 : 0.2);
            }, { passive: false });
            
            window.addEventListener('keydown', (e) => {
                if (document.getElementById('lightboxOverlay').style.display === 'flex') {
                    if (e.key === 'Escape') closeLightbox();
                    if (e.key === 'ArrowRight') nextLightboxImage();
                    if (e.key === 'ArrowLeft') prevLightboxImage();
                }
            });
        }

        // --- EXPORT TO CSV ---
        function exportCSV() {
            if(data.activeTab === 0) {
                data.tabs.forEach(tab => triggerCSVDownload(tab));
            } else {
                triggerCSVDownload(data.tabs[data.activeTab - 1]);
            }
        }

        function triggerCSVDownload(tab) {
            const headers = tab.columns.map(c => `"${c.replace(/"/g, '""')}"`).join(',');
            const rows = tab.rows.map(row => {
                return tab.columns.map(col => `"${String(row[col] || '').replace(/"/g, '""')}"`).join(',');
            }).join('\n');
            
            const csv = headers + '\n' + rows;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `${tab.name.replace(/\s+/g, '_')}_Results.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- BOOTSTRAP ---
        init();
    </script>
</body>
</html>
